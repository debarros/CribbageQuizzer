# cribbage's adapter (design 3.1): pjd adopt and pjd run launch [commands] battery.
# The proof of a consumer with no Python battery is the hook replay (design 3.4): the tool calls
# this repository's sessions made, replayed through the released and the candidate guard.
# --released is left out on purpose: its default is the environment that the trunk's .pjd/uv.lock
# names, which at an adoption is the release being moved from (plan cribbage/pin, Decision 359A).
# Until machine/cribbage-hub makes the trunk, this command exits 2, and it runs only with --released
# appended, as `pjd run cribbage battery -- --released <python>` (plan cribbage/catch-up).
# --also names this clone by its path before the cutover renames it: once path_today names the
# trunk, the replay reads the clone's transcripts only through --also, which matches them by the
# path's text, so the folder need not exist (Decision 403A).
schema = 1

[commands]
battery = [
  "{python}", "-I", "-m", "pjdtools.replay", "cribbage", "--candidate", "{python}",
  "--also", "C:/Users/pjdeb/Documents/CribbageQuizzer",
]
